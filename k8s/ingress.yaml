apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vuln-app-ingress
spec:
  rules:
    - host: vuln.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vuln-app-service
                port:
                  number: 8080